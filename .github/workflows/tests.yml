name: Tests

# Runs the unit tests on their own, outside the main CI:
# - on every push to a branch other than main (CI already covers main and PRs)
# - every night against main, to catch breakage from dependency drift
# - on demand from the Actions tab
on:
  push:
    branches-ignore: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm test
